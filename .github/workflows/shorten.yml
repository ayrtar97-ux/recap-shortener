name: Shorten Recap Video

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: "GitHub Release asset ID of the uploaded video (created by the web app)"
        required: true
      release_id:
        description: "GitHub Release ID to clean up after the run (optional)"
        required: false

permissions:
  contents: write

jobs:
  shorten:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Myanmar font (for Burmese subtitles)
        run: sudo apt-get install -y fonts-noto-core

      - name: Install dependencies
        run: npm install

      - name: Install edge-tts
        run: pip install --break-system-packages -U edge-tts

      - name: Download input video from GitHub Release asset
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ github.event.inputs.asset_id }}" \
            -o input.mp4

      - name: Verify downloaded video
        run: |
          ls -lh input.mp4
          file input.mp4

      - name: Run recap shortener
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node recap-to-short.js input.mp4 output.mp4

      - name: Dub with Burmese AI voice + burn subtitles + remove watermark + mirror
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDGE_TTS_VOICE: en-US-AvaNeural
          BG_MUSIC_PATH: assets/bgmusic.mp3
        run: node dub-and-caption.js output.mp4 final_output.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_output.mp4

      - name: Clean up temporary release (best-effort)
        if: always() && github.event.inputs.release_id != ''
        continue-on-error: true
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.inputs.release_id }}"
