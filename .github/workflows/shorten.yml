name: Shorten Recap Video

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL of the recap video (e.g. https://www.youtube.com/watch?v=xxxxxxxxxxx)"
        required: true

jobs:
  shorten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Install yt-dlp
        run: pip install --break-system-packages -U yt-dlp

      - name: Download input video from YouTube
        run: yt-dlp -f "bv*[height<=720]+ba/b[height<=720]" --merge-output-format mp4 -o input.mp4 "${{ github.event.inputs.youtube_url }}"

      - name: Verify downloaded video
        run: |
          ls -lh input.mp4
          file input.mp4

      - name: Run recap shortener
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node recap-to-short.js input.mp4 output.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output.mp4
