name: Shorten Recap Video

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID of the recap video (the long code in the share link, e.g. 1USOn6j0dBG14hWNvUB811B21SqKt_eFn)"
        required: true

jobs:
  shorten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Install gdown
        run: pip install --break-system-packages gdown

      - name: Download input video from Google Drive
        run: gdown --id "${{ github.event.inputs.drive_file_id }}" -O input.mp4

      - name: Verify downloaded video
        run: |
          ls -lh input.mp4
          file input.mp4

      - name: Run recap shortener
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node recap-to-short.js input.mp4 output.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output.mp4
